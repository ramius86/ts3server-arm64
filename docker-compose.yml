services:
  teamspeak:
    # Use a specific version tag for reproducibility, or 'latest' for auto-updates via Watchtower.
    # Available tags: ghcr.io/ramius86/ts3server-arm64:<TS3_VERSION>
    image: ${TS3_IMAGE:-ghcr.io/ramius86/ts3server-arm64:latest}
    container_name: teamspeak3
    restart: unless-stopped
    ports:
      - "9987:9987/udp"           # Voice
      - "127.0.0.1:10011:10011"   # ServerQuery (raw) — localhost only; change to "10011:10011" to allow remote access
      - "30033:30033/tcp"         # File transfer
    volumes:
      - ./data:/teamspeak/save
    environment:
      - TIME_ZONE=${TIME_ZONE:-Europe/Rome}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - INIFILE=${INIFILE:-1}
      - DEBUG=${DEBUG:-0}
      - TS3SERVER_LICENSE=${TS3SERVER_LICENSE:-accept}
      - LOG_CLEANUP_DAYS=${LOG_CLEANUP_DAYS:-7}
# ===== BOX64 TUNING (ARM64 EMULATION) =====
# Safe defaults are baked directly into the Dockerfile image.
# Override here only if specific tuning is needed.
      - BOX64_DYNAREC=1                 # Enable JIT recompiler (default on, explicit for clarity)
      - BOX64_DYNAREC_STRONGMEM=1       # Enforce x86 strong memory model — improves SQLite stability under load
      - BOX64_DYNACACHE=1               # Enable JIT compilation cache
      - BOX64_DYNACACHE_FOLDER=/teamspeak/save/.box64cache # Store JIT cache in volume for near-instant restarts
      - BOX64_LOG=0                     # Disable verbose logging in production
      - BOX64_NOBANNER=1                # Suppress startup banner
